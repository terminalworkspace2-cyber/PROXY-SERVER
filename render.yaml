services:
  - type: web
    name: omniroute-gateway
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GATEWAY_API_KEY
        generateValue: true
      - key: UPSTREAM_BASE_URL
        sync: false
      - key: CF_ACCESS_CLIENT_ID
        sync: false
      - key: CF_ACCESS_CLIENT_SECRET
        sync: false
